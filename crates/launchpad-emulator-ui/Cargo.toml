[package]
name = "launchpad-emulator-ui"
version = "0.1.0"
description = "An egui widget that draws and drives a Launchpad emulator surface"
keywords = ["novation", "launchpad", "emulator", "egui", "midi"]
categories = ["emulators", "gui", "multimedia"]
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
egui = "0.36"
launchpad-emulator = { version = "0.1.0", path = "../launchpad-emulator" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }

[lints]
workspace = true
